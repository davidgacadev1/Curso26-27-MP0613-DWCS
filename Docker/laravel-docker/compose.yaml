# =============================================================================
#  Entorno de desarrollo de Laravel: arquitectura "de producción"
#  Nginx + PHP-FPM 8.4 (Xdebug, Composer) + MariaDB + Redis + Vite (Node) + Mailpit
#  y un trabajador de colas (queue:work)
#
#  Primera vez:  docker compose up -d --build
#                docker compose exec app bash /scripts/preparar.sh
#  Artisan:      docker compose exec app php artisan route:list
#
#  URLs (puertos del .env):
#    http://localhost:8110        la aplicación (Nginx)
#    http://localhost:8110/carta  ejemplo del Bar Baio
#    http://localhost:5173        servidor de Vite (lo usa la página, no se abre)
#    http://localhost:8111        phpMyAdmin
#    http://localhost:8028        Mailpit
# =============================================================================
name: laraveldev

x-app: &app
  build:
    context: ./docker
    dockerfile: php/Dockerfile
    args:
      PHP_VERSION: ${PHP_VERSION:-8.4}
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: laraveldev/php-fpm:${PHP_VERSION:-8.4}
  user: www-data
  volumes:
    - ./src:/var/www/html
    - ./scripts:/scripts:ro
  environment:
    XDEBUG_MODE: ${XDEBUG_MODE:-debug,develop}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:

  # --- PHP-FPM: ejecuta Laravel ------------------------------------------------
  app:
    <<: *app
    restart: unless-stopped

  # --- Nginx: recibe las peticiones HTTP --------------------------------------
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8110}:80"
    volumes:
      # Nginx también necesita el código: sirve directamente CSS, JS e imágenes de public/
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # --- Trabajador de colas: ejecuta los trabajos (correos, etc.) en segundo plano
  queue:
    <<: *app
    restart: unless-stopped
    environment:
      XDEBUG_MODE: "off"
    command: >
      bash -c 'until [ -f vendor/autoload.php ] && [ -f .env ]; do sleep 5; done;
               php artisan queue:work --tries=3 --sleep=2'

  # --- Node + Vite: compila CSS/JS y recarga el navegador al guardar ----------
  vite:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /var/www/html
    user: node
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./src:/var/www/html
    # Espera a que exista el proyecto; la primera vez instala las dependencias de Node
    command: >
      sh -c 'until [ -f package.json ]; do echo "Esperando al proyecto Laravel..."; sleep 5; done;
             [ -d node_modules ] || npm install;
             npm run dev -- --host 0.0.0.0'

  db:
    image: mariadb:${MARIADB_VERSION:-11.4}
    restart: unless-stopped
    ports:
      - "${DB_PORT_HOST:-3311}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-laravel}
      MARIADB_USER: ${DB_USER:-laravel}
      MARIADB_PASSWORD: ${DB_PASSWORD:-laravel}
    volumes:
      - datos-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Redis: caché, sesiones y colas en memoria -------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - datos-redis:/data

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8111}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAIL_PORT:-8028}:8025"

volumes:
  datos-mariadb:
  datos-redis:
