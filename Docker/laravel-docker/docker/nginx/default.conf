# =============================================================================
#  Nginx sirve los ficheros estáticos de public/ y pasa a PHP-FPM todo lo demás.
#  Es la configuración recomendada por Laravel (laravel.com/docs/deployment).
# =============================================================================
server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 64M;

    # Si no existe el fichero ni la carpeta, la petición va al controlador frontal
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # PHP: FastCGI al servicio "app" (contenedor PHP-FPM), puerto 9000
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Nada de ficheros ocultos (.env, .git...)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
