; Ajustes de PHP para desarrollar con Laravel
date.timezone = Europe/Madrid
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
error_reporting = E_ALL
; Laravel muestra sus propias páginas de error (APP_DEBUG=true en src/.env)
display_errors = Off
log_errors = On
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
