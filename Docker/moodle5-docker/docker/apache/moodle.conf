# =============================================================================
#  Sitio de Moodle. MOODLE_DOCROOT viene del entorno (Dockerfile / compose.yaml):
#    Moodle 5.1 o posterior:  /var/www/moodle/public
#    Moodle 5.0:              /var/www/moodle
# =============================================================================
ServerName localhost

<VirtualHost *:80>
    DocumentRoot ${MOODLE_DOCROOT}

    <Directory ${MOODLE_DOCROOT}>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        # Router de Moodle (obligatorio desde 5.1): lo que no es un fichero va a r.php
        DirectoryIndex index.php
        FallbackResource /r.php
    </Directory>

    # Moodle 5.0 (sin carpeta public): no servir ficheros internos
    <DirectoryMatch "/(\.git|vendor|node_modules|tests|behat|phpunit)/">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^(config\.php|composer\.(json|lock)|.*\.(md|lock|yml|xml\.dist))$">
        Require all denied
    </FilesMatch>

    # Permite que /pluginfile.php/1/... llegue a PHP con su PATH_INFO
    AcceptPathInfo On
</VirtualHost>
