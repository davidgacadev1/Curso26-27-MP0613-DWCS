; Ajustes de PHP para desarrollar con WordPress
date.timezone = Europe/Madrid
error_reporting = E_ALL
display_errors = On
log_errors = On
error_log = /dev/stderr
upload_max_filesize = 128M
post_max_size = 128M
memory_limit = 512M
max_execution_time = 300
max_input_vars = 5000
; Correos de WordPress (registro, contraseñas, formularios) -> Mailpit
sendmail_path = "/usr/local/bin/mailpit sendmail -S mailpit:1025"
; OPcache revisa los ficheros en cada petición
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
