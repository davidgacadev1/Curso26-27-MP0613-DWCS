; =============================================================================
;  Xdebug 3. El modo se elige con la variable XDEBUG_MODE del fichero .env
; =============================================================================
; Iniciar la depuración en TODAS las peticiones (y scripts de consola).
; Si VS Code no está escuchando, simplemente no se para.
xdebug.start_with_request = yes
; VS Code se ejecuta en tu equipo, no en el contenedor
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
; No llenar el log de avisos "Could not connect to debugging client"
xdebug.log_level = 0
; Cuántos elementos se muestran de los arrays en var_dump() (modo develop)
xdebug.var_display_max_depth = 5
xdebug.var_display_max_children = 128
xdebug.var_display_max_data = 1024
