; Ajustes de PHP para desarrollar con Symfony
date.timezone = Europe/Madrid
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
error_reporting = E_ALL
; Symfony muestra sus propias páginas de error (APP_ENV=dev) y la barra de depuración
display_errors = Off
log_errors = On
; OPcache y APCu: recomendados por Symfony; en desarrollo se revisan los ficheros en cada petición
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
apc.enable_cli = 1
