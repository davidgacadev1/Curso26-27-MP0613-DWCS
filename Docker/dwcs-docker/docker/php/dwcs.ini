; =============================================================================
;  Ajustes de PHP para desarrollo (se cargan después de php.ini-development)
; =============================================================================
date.timezone = Europe/Madrid
default_charset = "UTF-8"

; Errores: verlos todos en pantalla y en el log de Docker (docker compose logs web)
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /dev/stderr

; Igual que XAMPP: un pequeño búfer de salida (permite header() después de algún echo)
output_buffering = 4096

; Subidas de ficheros y memoria
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 120
max_input_vars = 5000

; mail() entrega los mensajes a Mailpit (http://localhost:8025)
sendmail_path = "/usr/local/bin/mailpit sendmail -S mailpit:1025"

; OPcache: comprueba en cada petición si el fichero ha cambiado (imprescindible al desarrollar)
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
