# =============================================================================
#  Sitios virtuales de Apache (equivale a httpd-vhosts.conf de XAMPP)
#  Los nombres *.localhost apuntan solos a 127.0.0.1: no hay que tocar "hosts".
# =============================================================================
ServerName localhost

<Directory /var/www>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

# http://localhost:8080  ->  www/localhost (panel del entorno)
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/localhost
</VirtualHost>

# http://dwcs.localhost:8080  ->  www/dwcs (tu código)
<VirtualHost *:80>
    ServerName dwcs.localhost
    DocumentRoot /var/www/dwcs
</VirtualHost>

# http://dwcs-profe.localhost:8080  ->  www/dwcs-profe (repositorio del profesor)
<VirtualHost *:80>
    ServerName dwcs-profe.localhost
    DocumentRoot /var/www/dwcs-profe
</VirtualHost>

# Cualquier otra carpeta: http://ejercicio1.localhost:8080  ->  www/ejercicio1
# (mod_vhost_alias: %1 es la primera parte del nombre)
<VirtualHost *:80>
    ServerName comodin.localhost
    ServerAlias *.localhost
    UseCanonicalName Off
    VirtualDocumentRoot /var/www/%1
</VirtualHost>
